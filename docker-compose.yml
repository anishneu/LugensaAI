# One command to run the whole thing:   docker compose up --build
# Then open http://localhost:3000
#
# Ollama (the local model) is NOT started here: it runs on your machine, where it can use your GPU, and the backend reaches it
# through host.docker.internal. Install it, run `ollama pull qwen3:30b`, and set OLLAMA_ENABLED=1 in backend/.env.
# Nothing needs a key: with none set the app runs and says plainly that it has nothing to search.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Keys and switches are read from backend/.env at run time (they are never copied into the image). If the file is
    # missing, the app runs with nothing configured. `required: false` needs Docker Compose 2.24 or newer.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Overrides any OLLAMA_BASE_URL in backend/.env: inside the container, "localhost" is the container itself.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evidence:/app/data
      - model-cache:/home/lugensa/.cache
      - translation-packs:/home/lugensa/.local/share
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # What the browser calls. Change it if you publish the backend on another host or port.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  evidence:
  model-cache:
  translation-packs:
