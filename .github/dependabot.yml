version: 2

# DISABLED: the project is complete, so Dependabot does not open update PRs on its own. Every ecosystem below has
# `open-pull-requests-limit: 0`, which turns version updates off while keeping this file as it was. To run updates again, set each
# limit back to its old value (2 for pip and npm, 1 for the workflows) and, if you like, change `interval`.
#
# When enabled: monthly, grouped update PRs (minor and patch together), no major-version bumps (those are decisions, not chores).

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
