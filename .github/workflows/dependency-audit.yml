name: Dependency audit

# Known-vulnerability checks for both halves of the project.
#  - Pull requests: flag a newly introduced vulnerable or badly-licensed dependency.
#  - Weekly: re-audit what is already installed, since advisories are published
#    long after a dependency was added.

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review new dependencies (PRs)
    # Dependency review needs the dependency graph, which on a private repository is Advanced Security (paid).
    # Same rule as CodeQL: run when the repo is public, or when the CODE_SCANNING variable is "true".
    if: ${{ github.event_name == 'pull_request' && (github.event.repository.private == false || vars.CODE_SCANNING == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # A comment needs a write token, which Dependabot's PRs never get; the result is in the job summary.
          comment-summary-in-pr: never

  python-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Audits what is actually installed, not just what requirements.txt names. That includes pip
      # itself and setuptools, so upgrade both first: the runner's Python image ships older copies with
      # published advisories (setuptools 78.1.0 failed this job, fixed in 83.0.0). Neither is ours: they are
      # tooling in the image (torch, spacy and thinc accept any newer setuptools, and the backend tests pass on 84.0.0).
      #
      # One advisory is ignored on purpose, and only this one:
      #   PYSEC-2026-3075 (stanza, unsafe pickle loading of model files; fixed in 1.12.2).
      # The latest argostranslate (1.11.0, the free offline translator) pins stanza==1.10.1, so the
      # fixed version cannot be installed alongside it. Exploiting it needs an attacker to place a
      # malicious model file on the machine (a poisoned model repository or shared cache); stanza's
      # models here come from Stanford's own Hugging Face repository via Argos. Remove this
      # exception when argostranslate allows stanza >= 1.12.2.
      - name: Audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2026-3075

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
