name: Dependency audit

# Known-vulnerability checks for both halves of the project.
#  - Pull requests: flag a newly introduced vulnerable or badly-licensed dependency.
#  - Weekly: re-audit what is already installed, since advisories are published
#    long after a dependency was added.

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review new dependencies (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  python-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Audits what is actually installed, not just what requirements.txt names. That includes pip
      # itself, so upgrade it first: an older runner image ships a pip with published advisories.
      #
      # One advisory is ignored on purpose, and only this one:
      #   PYSEC-2026-3075 (stanza, unsafe pickle loading of model files; fixed in 1.12.2).
      # The latest argostranslate (1.11.0, the free offline translator) pins stanza==1.10.1, so the
      # fixed version cannot be installed alongside it. Exploiting it needs an attacker to place a
      # malicious model file on the machine (a poisoned model repository or shared cache); stanza's
      # models here come from Stanford's own Hugging Face repository via Argos. Remove this
      # exception when argostranslate allows stanza >= 1.12.2.
      - name: Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2026-3075

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
