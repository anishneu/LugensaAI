name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Deliberately the "this is actually broken" rules only: syntax errors,
      # undefined names, unused imports and variables. Style opinions would
      # fail the build over taste, which is what makes people stop reading CI.
      - name: Ruff
        run: ruff check backend --select E9,F63,F7,F82,F401,F841 --exclude backend/.venv

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # sentence-transformers depends on torch, and the default PyPI wheel
      # drags in gigabytes of CUDA libraries a CI runner never uses. Installing
      # the CPU build first lets the requirements install reuse it.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The autouse fixture in tests/conftest.py forces every real API key
        # and optional feature off regardless of environment, so this suite
        # is always free, offline, and deterministic — no secrets needed.
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # Browser tests against the Vite dev server with every backend call mocked: no backend, no keys, no network.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:e2e

      - name: Upload the UI test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
