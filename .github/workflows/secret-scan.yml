name: Secret scan

# This project reads Tavily and Google Maps keys from backend/.env, which is
# gitignored. The realistic failure is someone (or a tool) committing one by
# accident, so every push and PR is scanned for credentials. It looks at the
# full history, because a key removed in a later commit is still leaked.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# gitleaks reads the pull request's commits through the API on a PR, which needs pull-requests: read; with only
# contents: read that call is refused ("Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
