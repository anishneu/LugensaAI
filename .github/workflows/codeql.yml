name: CodeQL

# GitHub's static security analysis. Finds injection, unsafe deserialization,
# path traversal and similar bug classes in the Python backend and the
# TypeScript frontend.
#
# The analysis always runs, and works here (it scans every file). What differs is where the results go:
#  - Public repository, or a private one with GitHub Code Security: they are uploaded to code scanning (the Security
#    tab). Set the repository variable CODE_SCANNING to "true" for the private case.
#  - A private repository without it: code scanning does not exist for the repository, and the upload step fails with
#    "Code scanning is not enabled for this repository" after a clean analysis. Nothing is uploaded then. The results are
#    kept as a downloadable SARIF file, and any findings are printed in the job summary and as file annotations.
#
# Earlier failures on this repo were a missing `actions: read` permission (fixed: granted below), and on Dependabot's pull
# requests a read-only token that can never upload (the job skips them; the push and weekly scans cover the same code).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # New queries ship regularly, so re-scan weekly even when nothing changed.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same rule as the dependency review: results go to code scanning only where it exists.
  UPLOAD_TO_CODE_SCANNING: ${{ github.event.repository.private == false || vars.CODE_SCANNING == 'true' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot's token is read-only, so it cannot upload results whatever the workflow grants.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The database upload needs code scanning too.
          upload-database: ${{ env.UPLOAD_TO_CODE_SCANNING }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ env.UPLOAD_TO_CODE_SCANNING == 'true' && 'always' || 'never' }}
          output: codeql-results

      - name: Report findings (results are not uploaded to code scanning here)
        if: ${{ env.UPLOAD_TO_CODE_SCANNING != 'true' }}
        run: python3 .github/scripts/codeql_summary.py codeql-results

      - name: Keep the results file
        if: ${{ env.UPLOAD_TO_CODE_SCANNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          retention-days: 30
