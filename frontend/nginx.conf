server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: /app is a route in the browser, not a file, so anything that is not a real file gets index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets never change, so they can be cached for a long time; the page itself must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
